kind = "mobile"
previewPath = "/"
title = "Aviate.Navigate.Communicate (ANC UAV)"
description = "An offline-first Australian RPAS field app for iPhone and iPad, starting with an NSW RFS content pack and a path to agency-neutral document imports."
version = "1.0.0"
id = "artifacts/anc-uav"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 20115

[services.development]
run = "pnpm --filter @workspace/anc-uav run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/anc-uav", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/anc-uav", "run", "serve" ]

[services.env]
PORT = "20115"
BASE_PATH = "/"
